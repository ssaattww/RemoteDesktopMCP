    description: Input-validation rejection uses the submitted projected session_id as audit correlation before proving that the session exists and belongs to the current principal.
    impact:
      - A foreign valid session_id causes the caller's rejected operation to be attached to the foreign session object and disappear from the caller's user console.
      - A nonexistent syntactically valid session_id creates a phantom unavailable session row.
      - Audit visibility and session-correlation integrity do not satisfy the rejected-operation tracking requirement.
    evidence:
      foreign_session_probe:
        rejected_session_id: foreign_session_id
        owner_session_rows: 0
        foreign_session_user: other@example.test
        foreign_contains_owner_rejected: true
      nonexistent_session_probe:
        phantom_session: true
        user: owner@example.test
        state: unavailable
        contains_rejected: true
    required_action:
      - Accept submitted session_id for audit correlation only after proving it is an existing session owned by the current principal.
      - Otherwise correlate the rejected operation under request:<operationId> and keep any bounded submitted identifier only as request detail if needed.
      - Add a foreign-session schema-rejection composition test proving caller visibility and no foreign-session contamination.
      - Add a nonexistent-session schema-rejection composition test proving no phantom session row is created.
      - Check whether the same correlation boundary should be shared with the normal tool wrapper; if deferred, record that pre-existing sibling explicitly.
