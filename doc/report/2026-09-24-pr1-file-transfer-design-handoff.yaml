target:
  work_start_head: 95ec1874e6fe82d92d2d77253cfe83a6ccbf1865
  technical_head: e11fc23c12aa17e3d95bbfd623c90ea862c01feb
  current_head: e11fc23c12aa17e3d95bbfd623c90ea862c01feb

scope:
  - Add ChatGPT/OpenAI MCP Connector to the architecture diagram.
  - Design bidirectional remote file transfer as a RemoteDesktopMCP feature.
  - Exclude Desktop Commander server configuration from RemoteDesktopMCP file APIs and transfers.
  - Keep process_start same-user trust model unchanged.
  - Do not implement runtime behavior.

design:
  connector:
    location: ChatGPT / OpenAI side
    responsibility:
      - MCP server connection target
      - authentication connection flow
    server_location: coordinator PC
  file_transfer:
    owner: RemoteDesktopMCP
    transport: existing MCP connection
    extra_public_http_endpoint: false
    external_temporary_url_required: false
    encoding: base64 chunks
    initial_chunk_size: 256 KiB
    identity:
      - transfer_id
      - session_id
      - node_id
    tools:
      - file_transfer_download_begin
      - file_transfer_download_chunk
      - file_transfer_upload_begin
      - file_transfer_upload_chunk
      - file_transfer_upload_commit
      - file_transfer_status
      - file_transfer_cancel
    integrity:
      algorithm: SHA-256
      download_change_detection:
        - size
        - modification time
      upload_commit:
        - write to temporary file
        - verify expected size
        - verify SHA-256
        - replace destination only after successful verification
    overwrite:
      default: false
      requires_explicit_permission: true
    resume:
      same_server_process: supported through status/next offset
      after_server_restart: unsupported
  multi_pc:
    coordinator_target: handle chunks locally
    remote_executor_target: relay transfer state and chunks over existing node connection
    remote_executor_public_endpoint: false
  desktop_commander:
    reuse_for:
      - search
      - normal reads
      - partial edits
      - process execution
    direct_rdmcp_exception:
      - raw byte reads required by file transfer
      - temporary-file writes required by file transfer
    no_desktop_commander_fork_required: true
  protected_configuration:
    target: Desktop Commander server configuration file
    recommended_location: outside Desktop Commander and RemoteDesktopMCP allowed directories
    excluded_apis:
      - file_search
      - content_search
      - file_read
      - file_patch
      - file_transfer_*
    search_must_not_scan_file: true
    path_identity: canonical/resolved path
    process_start_isolation: not_guaranteed
    reason: process_start intentionally has the MCP server OS user's authority

files:
  changed:
    - doc/design/functional-requirements.md
    - doc/design/multi-pc-architecture.md
    - doc/design/tailscale-funnel-architecture.md
