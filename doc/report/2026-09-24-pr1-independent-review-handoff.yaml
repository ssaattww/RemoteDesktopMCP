    description: ローカル専用設定を、process_startのシェルと子孫プロセスから守る必須の実行権限境界が未定義。直近の文章変更以前から存在するPR全体の問題。
    impact: 同一OSユーザーでの実行を許す現在の設計では、許可ユーザー設定・ノード登録・秘密情報・監査ログへリモートコマンドから到達し得る。未認証侵入や実データ改変を再現したものではない。
