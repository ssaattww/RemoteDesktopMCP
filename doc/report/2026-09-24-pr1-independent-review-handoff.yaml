    required_action: 設定管理主体とコマンド・子孫の強制的な実行境界を具体化する。秘密の環境/ハンドル/管理接続を継承せず、保護設定や実行経路の変更で解除できない条件、隔離不能時の拒否、実配備の主体での許可/拒否試験を定義する。統括と実行を兼ねる場合も必須。禁止コマンド、cwd、管理ツール非公開だけで完了としない。
