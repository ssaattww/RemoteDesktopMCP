findings:
  - id: RDMCP-25-DR-001
    severity: high
    origin: introduced_by_change
    location: "doc/design/multi-pc-architecture.md:614,644-646,674-680,974"
    description: remote download transfer cannot recover a chunk whose executor-side state advanced before its response was lost
    impact: same-generation reconnect can report a next offset after bytes the coordinator never received; final-chunk loss may leave no snapshot to replay
    required_action: define idempotent/acknowledged download replay semantics and add middle/final response-loss reconnect tests
  - id: RDMCP-25-DR-002
    severity: medium
    origin: introduced_by_change
    location: "doc/design/file-paths-and-live-logs.md:15-17 versus functional-requirements.md:31,254 and multi-pc-architecture.md:804,1072"
    description: node_list is sessionless pre-session discovery in the new design but a direct dependency still requires an active session
    impact: authoritative design documents describe mutually incompatible API preconditions
    required_action: align file-paths-and-live-logs.md with authenticated but session-optional node_list semantics
