findings:
  - id: RDMCP-IFR-001
    severity: high
    origin: introduced_by_change
    location: doc/design/multi-pc-architecture.md:253-284
    description: >
      Management-side secret file isolation is now defined, but the execution worker and
      process_start commands share the same execution OS identity while the design does not
      require the management-to-worker control channel itself to reject direct access,
      impersonation, replacement, or privileged-handle acquisition by arbitrary processes
      running under that execution identity.
    impact: >
      A conforming implementation can allow process_start descendants to bypass the
      management authentication/session/node/audit gates and invoke or tamper with worker
      operations, even though management-side files remain protected by OS ACLs.
    evidence: >
      The design requires same-PC management/worker communication, configuration protection,
      and non-inheritance of management handles, but does not define caller authentication or
      an OS-enforced/cryptographic boundary preventing same-execution-user descendants from
      opening or impersonating the worker control endpoint. The Windows fixture does not test
      direct control-channel access or worker impersonation.
    required_action: >
      Define a control-channel trust boundary that accepts requests only from authenticated
      management-side identity/capability; prevent process_start commands and descendants
      from opening, impersonating, replacing, or acquiring the privileged channel; fail
      closed when that boundary is unavailable; and add a deployed negative test for direct
      channel access/impersonation.

