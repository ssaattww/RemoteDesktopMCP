findings:
  - id: RDMCP-R5
    severity: high
    origin: introduced_by_fix
    location: doc/design/functional-requirements.md process operation requirements; doc/design/multi-pc-architecture.md process_output mapping
    description: Desktop Commander 0.2.50 merges stdout and stderr into one line buffer, so read_process_output cannot provide the separate stdout/stderr contract described by the design.
    impact: The public process output contract is not implementable as written without changing the contract, requiring an upstream capability, or defining a justified exception.
    evidence: Installed Desktop Commander 0.2.50 TerminalManager appends stdout and stderr to session.outputLines; readProcessOutput returns the merged lines. FA780 probe confirmed merged output.
    required_action: Define a process output contract that the pinned RDC version can supply, or require an RDC/upstream tool that exposes structured stdout/stderr; add a focused contract validation.
  - id: RDMCP-R6
    severity: high
    origin: introduced_by_fix
    location: doc/design/multi-pc-architecture.md local delegation, process mapping, and failure handling
    description: Logical process IDs map to Desktop Commander local PID without a Desktop Commander instance generation, while the design permits the local MCP child to restart.
    impact: After restart and OS PID reuse, a stale logical process ID can resolve to a different new process; process_kill could terminate the wrong process.
    evidence: Desktop Commander 0.2.50 TerminalManager keys active/completed sessions by PID and force_terminate accepts PID only; design has no generation invalidation rule.
    required_action: Bind mapping to at least node_id + Desktop Commander generation + PID, invalidate prior-generation mappings on transport/process restart, and validate stale-ID rejection.

