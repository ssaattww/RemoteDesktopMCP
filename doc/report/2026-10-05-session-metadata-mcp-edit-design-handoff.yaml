scope:
  - Design the MCP contract for editing existing session metadata.
  - Reuse RemoteDesktopService.updateSessionMetadata rather than duplicate mutation rules.
  - Define expected_version, session_list version exposure, process ordering, audit behavior, Todo gate behavior, and external-link safety.
  - Add common design/development terms to the markdown whitelist when natural Japanese technical writing benefits.
  - Publish the design in PR #74 with report and handoff evidence.

non_goals:
  - Implement session_update in src/index.ts.
  - Add product tests now.
  - Change the existing HTTP session edit behavior.
  - Change the URL title retrieval implementation.
  - Change the CI workflow because required diagnostics already exist.
  - Merge the PR.

