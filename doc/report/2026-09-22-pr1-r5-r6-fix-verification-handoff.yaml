findings:
  - id: RDMCP-R7
    severity: high
    origin: introduced_by_fix
    location: doc/design/multi-pc-architecture.md process identity and validation rules
    description: The generation-aware mapping still cannot distinguish PID reuse within the same Desktop Commander generation when an old process ended but RemoteDesktopMCP has not yet observed completion.
    impact: An old logical process ID can pass generation checks and target a new process with the same PID; process_kill could terminate the wrong process.
    evidence:
      - Desktop Commander 0.2.50 keys terminal sessions by PID.
      - Active session lookup has priority over completed session lookup.
      - The design permits multiple logical IDs but does not define a unique current owner for the same node_id/generation/pid tuple.
    required_action:
      - Maintain a unique current owner per node_id/generation/pid tuple.
      - Before publishing a new logical ID for a reused tuple, mark the prior mapping stale/state_unknown.
      - Never forward PID from a non-current-owner logical ID.
      - Exclude completed final snapshots from active PID ownership.
      - Add a same-generation PID-reuse validation case without restarting RDC.

