  resolved_findings:
    - id: RDMCP-R7
      severity: high
      disposition: resolved
      evidence:
        - One current_process_owner is maintained for each active/unconfirmed node/generation/pid process_key.
        - A reused key stales the old owner before the new logical ID is exposed.
        - Non-owner logical IDs do not forward PID to RDC.
        - Completed final snapshots are removed from active ownership.
findings:
  - id: RDMCP-R8
    severity: high
    origin: introduced_by_fix
    location: doc/design/multi-pc-architecture.md process_start and current-owner checks for process_status/process_output/process_kill
    description: Owner verification is not serialized with the RDC PID tool call, so a concurrent process_start can reuse the PID after an old logical ID passes owner verification but before its RDC call executes.
    impact: Old process_status/output can observe a new process, and old process_kill can terminate a different newly started process.
    evidence:
      - Desktop Commander 0.2.50 keys terminal sessions by PID only.
      - force_terminate and read_process_output accept PID without an incarnation token.
      - The R7 design atomically replaces current_process_owner but does not define mutual exclusion covering owner check through RDC tool completion and concurrent process_start.
    required_action: Serialize process_start and PID-forwarding status/output/kill at least per executor/Desktop Commander generation; recheck owner under the same exclusion and hold it through RDC tool completion, with an interleaving validation case.

