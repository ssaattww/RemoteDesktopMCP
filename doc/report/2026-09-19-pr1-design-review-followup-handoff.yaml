findings:
  - id: RDMCP-R1
    severity: high
    origin: introduced_by_change
    location: doc/design/functional-requirements.md and doc/design/multi-pc-architecture.md
    description: MCP transport boundaries did not define the independent RemoteDesktopMCP session lifecycle.
    impact: Session listing and process ownership were left to implementer interpretation.
    evidence: Initial review report RDMCP-R1.
    required_action: Define session generation, continuation, end, expiry, listing, and process association independently of MCP transport.
  - id: RDMCP-R2
    severity: high
    origin: introduced_by_change
    location: doc/design/multi-pc-architecture.md
    description: Node mutual authentication was stated but not defined at implementable protocol detail.
    impact: Credential ownership, replay defense, storage, rotation, revocation, and authentication failure behavior were unspecified.
    evidence: Initial review report RDMCP-R2.
    required_action: Define the initial node-authentication protocol and credential lifecycle.
  - id: RDMCP-R3
    severity: medium
    origin: introduced_by_change
    location: doc/design/functional-requirements.md and doc/design/multi-pc-architecture.md
    description: node_id omission depended on currently executable/connected node count.
    impact: The same request could target a different machine after connection-state changes.
    evidence: Initial review report RDMCP-R3.
    required_action: Make target-selection rules independent of connection state and test two registered nodes with only one connected.

