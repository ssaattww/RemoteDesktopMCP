      complete_body: >
        # PR #1 ノード認証と関連説明の再構成


        ## 対象と作業範囲


        - リポジトリ: ssaattww/RemoteDesktopMCP

        - PR: #1

        - ブランチ: feat/tailscale-funnel-design-lint

        - ベース: main

        - 作業開始HEAD: b55f57e528b7405c2428ba07ed24101c14280099

        - 設計変更後HEAD: 02675cd7081188a08f8424f9705e333f69e78836

        - 作業場所: FA780 / C:\Users\donabe\Project\RemoteDesktopMCP-pr1-r4-20260922

        - 記録時刻: 2026-09-24T10:04:43+09:00（チャット実行環境で取得）


        利用者の「ノード認証の部分が読みにくい。他にも読みにくい箇所を修正してほしい」という依頼に対応した。

        対象は設計3文書の説明順序、段落、見出し、表である。

        製品コード、認証方式、依存関係、既存ホワイトリスト、過去のレビュー報告は変更していない。


        ## ノード認証の変更


        以前の説明は、鍵や値の役割を十分に説明する前に、長い計算式と接続手順が続いていた。

        次の順序で読めるようにした。


        1. ノード認証で確認する相手と、ユーザー認証との違い。

        2. PSK、nonce、HMAC値、セッション鍵の役割。

        3. 接続前に管理者が設定する内容。

        4. 実行ノードと統括ノードの間で送る値と、双方の照合手順。

        5. 認証後のメッセージ検証。

        6. 鍵の保管・更新・ノード登録解除と監査ログ。


        計算式は手順の文章から分け、独立したコードブロックと入力表に移した。

        PSKを送信するのではなく、その鍵から計算したHMAC値を照合することを本文で説明した。

        接続専用のセッション鍵と、ユーザー操作をまとめる session_id は別のものと明記した。


        ## その他の変更


        | 文書 | 整理した箇所 |

        | --- | --- |

        | functional-requirements.md | セッションの開始・継続・終了とプロセスとの関係。Desktop Commander との分担、呼び出し手順、公開制限 |

        | multi-pc-architecture.md | 論理プロセスID、ノードID、世代ID、PIDの役割。PID再利用、排他制御、接続切断、終了済み処理を別の節に分離 |

        | tailscale-funnel-architecture.md | Googleでの本人確認と RemoteDesktopMCP
        の利用許可を区別。ツール呼び出しまでの手順、トークンの検証・無効化・保管を分離 |


        長いプロセス検証項目は、出力、再起動、終了済み処理、同一世代のPID再利用、並行操作の5項目に分けた。

        元の検証条件と期待結果を残し、条件を設定する操作と確認する結果を別の文にした。


        ## 仕様の照合


        作業担当として変更前後を読み比べ、次の制約が残っていることを確認した。

        これは自己確認であり、独立レビューや RDMCP-R8 の修正確認を代替しない。


        - ノードの組ごとに異なるPSKを使い、認証前の操作を拒否する。

        - HMACの入力順序、役割名、鍵生成の入力、接続IDと本文ハッシュの式を維持する。

        - PSKは32バイト、プロセスの世代IDは16バイト、セッションの無操作期限は24時間のままとする。

        - ノード登録と鍵の設定はローカル操作に限定し、秘密の値をログに出力しない。

        - 同じユーザーによるセッション継続と、セッション終了時にプロセスを自動停止しない規則を維持する。

        - PID再利用時の古いIDの無効化、世代の確認、ロック取得後の再確認、呼び出しと状態更新までのロック保持を維持する。

        - 終了済みプロセスは保存済みの結果を返し、無効なIDから Desktop Commander へPIDを渡さない。

        - OAuthの署名・発行者・有効期限・aud・nonceの検証と、許可ユーザー変更後の旧トークン拒否を維持する。


        数式・識別子・鍵長など12項目については、変更後にも対応する値が存在することを機械的に確認した。

        この検査は値の保持確認であり、認証プロトコルや並行制御の実行試験ではない。


        ## 用語とホワイトリスト


        今回の新しい追加候補はない。PSK、nonce、HMAC、ロックなど必要な用語は既に登録されていた。

        ホワイトリストは変更せず、設計3文書の未許可語は0件だった。

        一般語を検査対象から外すためのコード表記は追加していない。

        コードブロックは、認証の入力文字列と計算式を読みやすく独立表示するために使用した。


        ## 検証結果


        設計変更後HEADと同じ内容の作業ツリーで、次を実行した。

        実行時の基準HEADは 7c758b69d00abf0d4614b32c190401cd0bf2ed8a、内容のSHA-256は
        ff35b6fdccaba7c561845f5b811d633c93d049b760138e5bef1f9a79631c8daf である。


        | 検査 | 結果 |

        | --- | --- |

        | npm run lint | 成功 |

        | npm run check | 成功 |

        | npm run build | 成功 |

        | npm audit --audit-level=low | 成功 |

        | git diff --check | 成功 |

        | 設計3文書の未許可語抽出 | 0件 |

        | 指定した数式・識別子・鍵長の保持 | 12項目を確認 |


        ローカル検証は Windows / Node.js v24.20.0 で行った。

        既存CIは Ubuntu / Node.js 22 のため、同一環境での検証とは扱わない。


        途中の文書検査では、表中の連結記号による列数エラー、見出し前の空行不足、中黒を含めた語の抽出を検出した。

        表の記号をMarkdownとして適切に表示し、空行と句読点を修正してから再検査した。検査ルールの無効化やホワイトリストの拡張は行っていない。


        診断ファイルは C:/Users/donabe/Project/RemoteDesktopMCP-pr1-readability-20260924-0944 に保存した。

        各実行の標準出力、標準エラー、終了コード、検証対象ファイルのハッシュ一覧を保存している。

        このパスは接続先PC上の保存先であり、チャットへの添付ファイルではない。


        ## 診断workflowとCI


        既存の .github/workflows/lint.yml は、成功・失敗の両方で診断artifactを保存する。

        保存対象はインストールとlintの結果、標準出力、標準エラー、対象SHA、Node.jsとnpmの情報である。

        今回、workflowの変更は不要だった。


        この報告と引き継ぎファイルを含む最終候補でも全体検証を行う。

        最終コミットのSHAと、そのSHAに一致するCIの結果は、コミット作成後にPR本文とコメントへ記録する。

        別SHAの実行結果は代用しない。


        ## コミット


        - 7c758b69d00abf0d4614b32c190401cd0bf2ed8a: ノード認証の説明を段階別に再構成。

        - 02675cd7081188a08f8424f9705e333f69e78836: セッション、プロセス、OAuthと検証項目を再構成。


        ## 残る確認事項


        今回は文書の修正であり、ノード間認証やプロセス制御の実装・実接続試験は行っていない。

        RDMCP-R8のレビュー状態は変更していない。

        通常レビュアーは、説明順序の変更で既存仕様が欠落していないことも確認する。


        タスク台帳 tasks/tasks-status.md は存在せず、更新対象はなかった。

        マージは行わない。
