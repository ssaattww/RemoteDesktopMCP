findings:
  - id: RDMCP-IFR-002
    severity: medium
    origin: introduced_by_fix
    location: doc/design/functional-requirements.md and doc/design/multi-pc-architecture.md execution isolation requirements
    description: The current design mandates a separate execution OS user, Windows service, ACL boundary, and fail-closed process_start behavior even though the clarified product model permits same-user execution.
    impact: A valid intended deployment can lose process_start unless unnecessary isolation infrastructure is configured, and deployment complexity exceeds product requirements.
    evidence: Current design requires separate OS identities and disables process_start when the boundary cannot be verified; user explicitly states same MCP-server user permissions are acceptable and new sandbox development is excessive.
    required_action: Make same-OS-user execution the baseline trust model; document that arbitrary process_start has that user's authority; make separate-user/ACL/sandbox hardening optional rather than mandatory.
