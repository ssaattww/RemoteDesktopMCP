findings:
  - id: RDMCP-PR30-NR-001
    severity: medium
    origin: introduced_by_change
    location: "src/index.ts:906; doc/design/multi-pc-architecture.md:481; implementation report safety section"
    description: Inline download reaches complete state without recording transfer.complete; final chunked download has the same completion-audit gap.
    impact: Audit history cannot prove successful download completion.
    evidence: 'Focused call returned complete=true but transfer events were ["transfer.begin"] only.'
    required_action: Share download completion handling, record transfer.complete for inline and final-chunk completion with transferId/direction/sessionId/size/sha256, add regression tests, and align the implementation report.
  - id: RDMCP-PR30-NR-002
    severity: medium
    origin: coverage_miss
    location: "Issue #29 completion criteria; implementation report; test/regressions.test.ts:181-227"
    description: Required 1 MiB / 5 MiB / 25 MiB end-to-end, server-time, and tool-call measurements are not present.
    impact: The Issue acceptance evidence is incomplete and the need for batch/bulk follow-up cannot be decided from required measurements.
    evidence: Historical data covers files only up to 16938 bytes; new regression uses InMemoryTransport and chunkBytes=1024; localhost 512 KiB focused validation is not connector/Tailscale end-to-end evidence.
    required_action: Measure upload/download at 1/5/25 MiB, record tool calls, server time, end-to-end time and measurement segment in Issue/report, or leave the acceptance criterion explicitly incomplete.
  - id: RDMCP-PR30-NR-003
    severity: low
    origin: introduced_by_change
    location: "doc/design/multi-pc-architecture.md:407-430"
    description: Detailed download/upload sections still describe only legacy begin/chunk/commit flow while the preceding table defines inline flow.
    impact: The authoritative design is internally inconsistent.
    evidence: Inline body handling, validation, completion/audit, and fallback branching are absent from detailed sections.
    required_action: Update detailed sections to describe inline conditions, body transfer, validation, completion/audit, and chunked fallback consistently.

