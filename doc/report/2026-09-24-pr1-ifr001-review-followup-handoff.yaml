scope:
  - Separate protected settings management from Desktop Commander command execution using different OS users.
  - Protect settings, secrets, logs, boundary configuration, service configuration, and executables with OS access control.
  - Prevent management environment variables and handles from reaching Desktop Commander commands and descendants.
  - Forbid same-user fallback and require process_start to be unavailable when the boundary cannot be verified.
  - Define deployment-time positive and negative tests using the real deployment identities.
  - Preserve Desktop Commander reuse.

non_goals:
  - Implement the worker/service runtime in product code.
  - Perform real cross-account acceptance tests before the runtime exists.
  - Change RDMCP-R8 review status.
  - Merge PR #1.

