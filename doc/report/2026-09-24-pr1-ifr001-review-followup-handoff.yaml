  addressed_findings:
    - id: RDMCP-IFR-001
      severity: high
      reviewed_head: 99f2fd2a084156951db5f036d4bf01f79aded3e5
      disposition: addressed_pending_review
      evidence:
        - RemoteDesktopMCP management and Desktop Commander execution use different OS users.
        - The execution identity is non-administrator and has only workspace/scratch access.
        - Protected settings, PSKs, tokens, audit logs, DATA_DIR, service settings, executable paths, and boundary configuration are denied to the execution identity by OS access control.
        - The execution worker launches Desktop Commander under the restricted identity; the management process never launches unrestricted commands directly.
        - Worker/Desktop Commander environments are constructed without inheriting management secrets.
        - Management communication handles are not inherited by commands or descendants.
        - allowedDirectories and command deny lists are explicitly defense-in-depth, not the security boundary.
        - process_start is unavailable when the boundary cannot be verified; no same-user/direct fallback is allowed.
        - Deployment tests cover allowed workspace operations and denied access via shells, interpreters, redirection, descendants, symlinks/junctions, environment leakage, and boundary configuration modification.

