scope:
  - Make same-OS-user process execution the initial product trust model.
  - State that authenticated allowed users can exercise that OS user's command authority.
  - State that file_* allowed directories do not sandbox arbitrary process_start commands.
  - Make separate-user/OS ACL isolation optional.
  - Remove fail-closed behavior triggered only by absence of optional hardening.
  - Remove the obsolete mandatory-isolation fixture.
  - Keep Desktop Commander reuse and existing RDMCP-R8 process identity/concurrency rules.

non_goals:
  - Add a new sandbox.
  - Add a mandatory execution worker or Windows service.
  - Reimplement Desktop Commander operations.
  - Change OAuth, session, node authentication, or RDMCP-R8 behavior.
  - Merge PR #1.

