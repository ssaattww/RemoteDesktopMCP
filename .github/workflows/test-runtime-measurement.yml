name: test-runtime-measurement

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: test-runtime-measurement-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  measure:
    name: Measure individual Windows tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'ci-measure-runtime' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      CI_RUNNER_LABEL: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Skip an already successful measurement for this PR head
        id: measurement-gate
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          CI_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $decision = & node scripts/ci-test-measurement-gate.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $decision = $decision.Trim()
          if ($decision -notin @('run', 'skip')) { throw 'The measurement gate returned an invalid decision.' }
          "skip=$($decision -eq 'skip')" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.measurement-gate.outcome != 'failure' && steps.measurement-gate.outputs.skip != 'true'
        run: npm ci

      - name: Resolve workflow metadata
        if: steps.measurement-gate.outcome != 'failure' && steps.measurement-gate.outputs.skip != 'true'
        shell: pwsh
        env:
          CI_GITHUB_TOKEN: ${{ github.token }}
          CI_JOB_NAME: Measure individual Windows tests
        run: |
          New-Item -ItemType Directory -Path ci-artifacts -Force | Out-Null
          & node scripts/ci-test-scheduler.mjs metadata --root . --output ci-artifacts/workflow-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure each tracked test file
        if: steps.measurement-gate.outcome != 'failure' && steps.measurement-gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $env:CI_NPM_VERSION = (& npm.cmd --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path ci-artifacts -Force | Out-Null
          & node scripts/ci-test-measurement.mjs
          exit $LASTEXITCODE

      - name: Upload measurement evidence
        if: always() && steps.measurement-gate.outcome != 'failure' && steps.measurement-gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-runtime-measurement-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ci-artifacts/test-measurement-records
            ci-artifacts/test-duration-manifest.candidate.json
          if-no-files-found: warn
          retention-days: 14
