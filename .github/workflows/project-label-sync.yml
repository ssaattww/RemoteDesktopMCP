name: Project and issue label sync

on:
  issues:
    types: [labeled, unlabeled]
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read and report plans without writing
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: project-label-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize Project fields and issue labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          API_DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$API_DRY_RUN" = "true" ]; then
            node scripts/project-label-sync.mjs --api-dry-run
          else
            node scripts/project-label-sync.mjs
          fi
