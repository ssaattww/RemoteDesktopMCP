name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, check, build, and test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p ci-artifacts
          printf 'lint=not_run\ncheck=not_run\nbuild=not_run\ntest=not_run\n' > ci-artifacts/test-results.txt

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          npm ci >ci-artifacts/npm-ci.stdout.log 2>ci-artifacts/npm-ci.stderr.log
          status=$?
          printf 'command=npm ci\nexit_code=%s\n' "$status" > ci-artifacts/npm-ci.result.txt
          cat ci-artifacts/npm-ci.stdout.log
          cat ci-artifacts/npm-ci.stderr.log >&2
          exit "$status"

      - name: Run lint
        if: always()
        shell: bash
        run: |
          set +e
          npm run lint >ci-artifacts/lint.stdout.log 2>ci-artifacts/lint.stderr.log
          status=$?
          printf 'lint_exit_code=%s\n' "$status" >> ci-artifacts/test-results.txt
          printf 'command=npm run lint\nexit_code=%s\n' "$status" > ci-artifacts/lint.result.txt
          cat ci-artifacts/lint.stdout.log
          cat ci-artifacts/lint.stderr.log >&2
          exit "$status"

      - name: Run type check
        if: always()
        shell: bash
        run: |
          set +e
          npm run check >ci-artifacts/check.stdout.log 2>ci-artifacts/check.stderr.log
          status=$?
          printf 'check_exit_code=%s\n' "$status" >> ci-artifacts/test-results.txt
          printf 'command=npm run check\nexit_code=%s\n' "$status" > ci-artifacts/check.result.txt
          cat ci-artifacts/check.stdout.log
          cat ci-artifacts/check.stderr.log >&2
          exit "$status"

      - name: Build
        if: always()
        shell: bash
        run: |
          set +e
          npm run build >ci-artifacts/build.stdout.log 2>ci-artifacts/build.stderr.log
          status=$?
          printf 'build_exit_code=%s\n' "$status" >> ci-artifacts/test-results.txt
          printf 'command=npm run build\nexit_code=%s\n' "$status" > ci-artifacts/build.result.txt
          cat ci-artifacts/build.stdout.log
          cat ci-artifacts/build.stderr.log >&2
          exit "$status"

      - name: Test
        if: always()
        shell: bash
        run: |
          set +e
          npm test >ci-artifacts/test.stdout.log 2>ci-artifacts/test.stderr.log
          status=$?
          printf 'test_exit_code=%s\n' "$status" >> ci-artifacts/test-results.txt
          printf 'command=npm test\nexit_code=%s\n' "$status" > ci-artifacts/test.result.txt
          cat ci-artifacts/test.stdout.log
          cat ci-artifacts/test.stderr.log >&2
          exit "$status"

      - name: Record environment
        if: always()
        shell: bash
        run: |
          {
            printf 'sha=%s\n' "$GITHUB_SHA"
            printf 'node=' && node --version
            printf 'npm=' && npm --version
          } > ci-artifacts/environment.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-diagnostics-${{ github.sha }}
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 14

  windows-scheduler:
    name: Prepare test assignment (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      CI_RUNNER_LABEL: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare assignment
        shell: pwsh
        run: |
          $env:CI_NPM_VERSION = (& npm.cmd --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path ci-artifacts -Force | Out-Null
          & node scripts/ci-test-scheduler.mjs plan --root . --output ci-artifacts/test-scheduler.json --shard-count 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload shared assignment
        uses: actions/upload-artifact@v4
        with:
          name: test-scheduler-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ci-artifacts/test-scheduler.json
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Check, build, and test (Windows shard ${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: windows-scheduler
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI_RUNNER_LABEL: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare diagnostics
        shell: pwsh
        run: |
          $env:CI_NPM_VERSION = (& npm.cmd --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path ci-artifacts -Force | Out-Null
          'check=not_run', 'build=not_run', 'test=not_run' | Set-Content ci-artifacts/test-results.txt

      - name: Download shared assignment
        uses: actions/download-artifact@v4
        with:
          name: test-scheduler-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ci-artifacts

      - name: Install dependencies
        shell: pwsh
        run: |
          & npm.cmd ci 1> ci-artifacts/npm-ci.stdout.log 2> ci-artifacts/npm-ci.stderr.log
          $status = $LASTEXITCODE
          "command=npm.cmd ci`nexit_code=$status" | Set-Content ci-artifacts/npm-ci.result.txt
          Get-Content ci-artifacts/npm-ci.stdout.log
          Get-Content ci-artifacts/npm-ci.stderr.log | ForEach-Object { [Console]::Error.WriteLine($_) }
          exit $status

      - name: Run type check
        if: always()
        shell: pwsh
        run: |
          & npm.cmd run check 1> ci-artifacts/check.stdout.log 2> ci-artifacts/check.stderr.log
          $status = $LASTEXITCODE
          "check_exit_code=$status" | Add-Content ci-artifacts/test-results.txt
          "command=npm.cmd run check`nexit_code=$status" | Set-Content ci-artifacts/check.result.txt
          Get-Content ci-artifacts/check.stdout.log
          Get-Content ci-artifacts/check.stderr.log | ForEach-Object { [Console]::Error.WriteLine($_) }
          exit $status

      - name: Build
        if: always()
        shell: pwsh
        run: |
          & npm.cmd run build 1> ci-artifacts/build.stdout.log 2> ci-artifacts/build.stderr.log
          $status = $LASTEXITCODE
          "build_exit_code=$status" | Add-Content ci-artifacts/test-results.txt
          "command=npm.cmd run build`nexit_code=$status" | Set-Content ci-artifacts/build.result.txt
          Get-Content ci-artifacts/build.stdout.log
          Get-Content ci-artifacts/build.stderr.log | ForEach-Object { [Console]::Error.WriteLine($_) }
          exit $status

      - name: Test
        if: always()
        shell: pwsh
        run: |
          $env:CI_NPM_VERSION = (& npm.cmd --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dispatchJson = & node scripts/ci-test-scheduler.mjs dispatch --root . --plan ci-artifacts/test-scheduler.json --shard-id '${{ matrix.shard }}' --shard-count 3
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            "test_exit_code=$status" | Add-Content ci-artifacts/test-results.txt
            "command=node scripts/ci-test-scheduler.mjs dispatch`nexit_code=$status" | Set-Content ci-artifacts/test.result.txt
            exit $status
          }
          $dispatch = $dispatchJson | ConvertFrom-Json
          $testFiles = @($dispatch.files)
          if ($testFiles.Count -eq 0) {
            "test_exit_code=0`nempty_shard=true" | Add-Content ci-artifacts/test-results.txt
            "command=skipped empty shard`nfiles=0`nexit_code=0" | Set-Content ci-artifacts/test.result.txt
            exit 0
          }
          $testArgs = @('--import', 'tsx', '--test') + $testFiles
          & node @testArgs 1> ci-artifacts/test.stdout.log 2> ci-artifacts/test.stderr.log
          $status = $LASTEXITCODE
          "test_exit_code=$status" | Add-Content ci-artifacts/test-results.txt
          "command=node --import tsx --test explicit-assignment-files`nshard=${{ matrix.shard }}`nfiles=$($testFiles.Count)`nexit_code=$status" | Set-Content ci-artifacts/test.result.txt
          Get-Content ci-artifacts/test.stdout.log
          Get-Content ci-artifacts/test.stderr.log | ForEach-Object { [Console]::Error.WriteLine($_) }
          exit $status

      - name: Record environment
        if: always()
        shell: pwsh
        run: |
          @(
            "sha=$env:GITHUB_SHA"
            "node=$(& node --version)"
            "npm=$(& npm.cmd --version)"
          ) | Set-Content ci-artifacts/environment.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics-shard-${{ matrix.shard }}-${{ github.sha }}
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 14
